<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridiron Squares</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#c7cdd5;--card:#f3f4f6;--field:#fafbfc;--border:#8f99a5;--bi:#7b8693;--ink:#1a1a1a;--muted:#555f6e;--muted2:#6c757d;--accent:#1565c0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
#nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--card);border-bottom:2px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--ink);text-decoration:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:68px 16px 40px}
.h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin:0 0 2px}
.sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.lbl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin:0 0 4px;font-weight:600;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.inp{background:var(--field);border:1.5px solid var(--bi);border-radius:6px;padding:10px;font-size:16px;font-family:inherit;width:100%;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--accent)}
.btn{font:500 14px Inter,sans-serif;padding:11px 16px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.5}
.dark{background:var(--ink);color:#fff}.out{background:var(--field);border-color:var(--bi);color:var(--muted)}
.blk{width:100%}.sm{font-size:12px;padding:6px 12px}
.badge{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.grn{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}.red{background:#ffebee;color:#b71c1c;border:1px solid #ef9a9a}
.org{background:#fff3e0;color:#bf360c;border:1px solid #ffcc80}.blue{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9}
.err{background:#ffebee;border:1px solid #ef9a9a;color:#c62828;border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.info{background:#e3f2fd;border:1px solid #90caf9;color:#0d47a1;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:22px repeat(10,1fr);gap:2px;min-width:300px}
.cell{aspect-ratio:1;border-radius:4px;border:1.5px solid var(--bi);background:var(--field);font-size:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0;color:var(--muted)}
.hd{font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.t-paid{background:#fff3e0;border-color:#ffcc80;color:#bf360c}.t-pend{background:#fffde7;border-color:#fff176;color:#f9a825}
.t-me{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}.t-sel{background:#1565c0;border-color:#0d47a1;color:#fff}
.insp{background:#f3e5f5;border:1px solid #ce93d8;color:#4a148c;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 -2px 10px rgba(0,0,0,.12);margin-top:10px}
.pm{padding:10px;border:1.5px solid var(--bi);border-radius:8px;text-align:center;font-size:12px;font-weight:600;background:var(--field);cursor:pointer}
.pm.on{border-color:var(--accent);background:#e3f2fd;color:#0d47a1}
a{color:var(--accent)}
.sec{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.mini{display:grid;grid-template-columns:22px repeat(10,1fr);gap:2px;max-width:340px;margin:0 auto}
.mh{font-size:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center}
.mc{aspect-ratio:1;border-radius:4px;background:var(--field);border:1.5px solid var(--bi);transition:all .3s}
.mc.on{transform:scale(1.08);border-color:rgba(0,0,0,.35)}
.mc.w{background:#f9a825}.mc.r{background:#8e24aa}.mc.x{background:#1e88e5}.mc.k{background:#26a69a}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;margin:2px 10px 2px 0}.lg i{width:12px;height:12px;display:inline-block}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid #d4d9df}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
.code{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:8px;text-align:center;margin:6px 0}

body.landing{background:#050b1a}
.landing #nav{display:none}
.landing #app{max-width:none;padding:0}
.hero{position:relative;min-height:100vh;min-height:100svh;background:#050b1a var(--hero) center 30%/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,11,26,.6) 0%,rgba(5,11,26,0) 18%,rgba(5,11,26,0) 55%,rgba(5,11,26,.9) 100%)}
.hero>*{position:relative}
.hero-top{padding:max(18px,env(safe-area-inset-top)) 20px 0}
.hero-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px}
.hero-h{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:.95;letter-spacing:2px;margin:10px 0 6px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero-s{font-size:14px;opacity:.9;max-width:300px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hero-bot{padding:0 14px max(18px,env(safe-area-inset-bottom));display:flex;justify-content:flex-end}
.authcard{width:100%;max-width:400px;background:rgba(8,16,36,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px}
.authcard .inp{margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px;border-radius:8px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;font:600 13px Inter,sans-serif;cursor:pointer}
.tab.on{background:#fff;color:#111;border-color:#fff}
.authcard .go{background:#f9a825;color:#111;font-weight:600}
.authcard .err{margin-bottom:8px}
@media(max-width:899px){.hero-logo{font-size:22px}}
@media(min-width:900px){.hero{background-position:center 14%}.hero-top{padding:28px 48px 0}.hero-h{font-size:72px}.hero-s{font-size:17px;max-width:420px}.hero-bot{padding:0 48px 40px}}
.cta{width:100%;max-width:400px}
.cta .hero-h{margin:0 0 12px;font-size:40px}
.cta .go{padding:15px;font-size:16px}
.sheet{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .authcard{max-width:440px;margin:0 14px max(14px,env(safe-area-inset-bottom));position:relative}
.xbtn{position:absolute;top:6px;right:10px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:4px}
@media(min-width:900px){.cta .hero-h{font-size:60px}.sheet{justify-content:flex-end}.sheet .authcard{margin:0 48px 40px}}
body.admin #app{max-width:1100px}
.tabsbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.at{padding:8px 14px;border-radius:20px;border:1.5px solid var(--bi);background:var(--field);color:var(--muted);font:600 13px Inter,sans-serif;text-decoration:none;white-space:nowrap}
.at.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.stat{margin:0}.stat .n{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1.1}
.two{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);padding:8px 10px;border-bottom:1.5px solid var(--border)}
.tb td{padding:8px 10px;border-bottom:1px solid #d4d9df;vertical-align:top}
.tb tr.click{cursor:pointer}.tb tr.click:hover td{background:#e9ecf0}
.muted{color:var(--muted);font-size:11px}
@media(max-width:700px){.hm{display:none}}
@media(max-width:520px){.logo{font-size:17px;letter-spacing:1px;white-space:nowrap}#navr{display:flex;gap:4px}#nav .btn.sm{padding:5px 8px;font-size:11px;white-space:nowrap}#nav{padding:0 10px}}
</style>

<body>
<div id="nav"><a class="logo" onclick="go('/')">🏈 Gridiron Squares</a><div id="navr"></div></div>
<div id="app"></div>
<script>
/* ====== CONFIG: paste your values ====== */
const SUPABASE_URL = 'https://qlosfkfusnsebvdzogfq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-TP5ssGRM4L9LnBXcZ8xaw_52-ZY892';
// Central account players pay for Venmo / Zelle / Cash App (cash goes to the board owner)
const PAY = { venmo:'@your-venmo', zelle:'you@example.com', cashapp:'$your-cashapp' };
/* ======================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById('app'), $navr = document.getElementById('navr');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = c => '$' + (c/100).toFixed(c%100 ? 2 : 0);
let SET = { fee_mode:'one_square', fee_flat_cents:100, fee_percent:5, league_threshold:5, league_share_percent:25 }, setLoaded = false;
async function loadSettings() { try { const { data } = await sb.from('platform_settings').select('*').eq('id', 1).maybeSingle(); if (data) SET = { ...SET, ...data }; } catch(e) {} setLoaded = true; }
const feeFor = priceCents => SET.fee_mode === 'flat' ? SET.fee_flat_cents : SET.fee_mode === 'percent' ? Math.round(priceCents * 100 * SET.fee_percent / 100) : priceCents;
const feeLabel = () => SET.fee_mode === 'one_square' ? 'Board fee (price of one square)' : 'Platform fee';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:6}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const METHODS = { venmo:'Venmo', zelle:'Zelle', cashapp:'Cash App', cash:'Cash (to owner)' };
const TYPES = { classic:'Classic', reverse:'Reverse', cardinal:'Cross', fullneighbor:'Full Neighbor', custom:'Custom' };
const EXTRAS = { classic:{reverse:false,cross:false,corners:false}, reverse:{reverse:true,cross:false,corners:false}, cardinal:{reverse:false,cross:true,corners:false}, fullneighbor:{reverse:false,cross:true,corners:true} };
const SPLITS = { even:[25,25,25,25], finalmore:[20,20,20,40], final:[0,0,0,100] };
const PERIODS = ['Q1','Q2 (half)','Q3','Final'];
const rulesText = r => { if(!r) return ''; const p = r.periods||{}; const on = ['q1','q2','q3','q4'].map((k,i)=>p[k]?`${PERIODS[i]} ${p[k]}%`:null).filter(Boolean).join(' · ');
  const ex = [r.reverse&&'reverse', r.cross&&'up/down/left/right', r.corners&&'diagonal corners'].filter(Boolean);
  return `${on} — winner${ex.length ? ' gets ' + (r.main_pct||50) + '%, ' + ex.join(' + ') + ' share the rest' : ' takes all'}`; };
let me = null, profile = null;
const go = p => { location.hash = '#' + p; };

// invite link: /?join=CODE
const qp = new URLSearchParams(location.search);
if (qp.get('join')) { try { localStorage.setItem('pendingJoin', qp.get('join').toUpperCase()); } catch(e){} history.replaceState({}, '', location.pathname + location.hash); }
const pending = () => { try { return localStorage.getItem('pendingJoin'); } catch(e){ return null; } };
const clearPending = () => { try { localStorage.removeItem('pendingJoin'); } catch(e){} };

async function ensureProfile(user, name) {
  let { data } = await sb.from('users').select('*').eq('id', user.id).maybeSingle();
  if (!data) {
    const nm = name || user.user_metadata?.name || user.email.split('@')[0];
    await sb.from('users').insert({ id: user.id, name: nm, email: user.email });
    ({ data } = await sb.from('users').select('*').eq('id', user.id).maybeSingle());
  }
  return data;
}
function renderNav() {
  $navr.innerHTML = me ? `${profile?.is_owner ? '<button class="btn out sm" onclick="go(\'/admin\')">Admin</button> ' : ''}<button class="btn out sm" onclick="go(\'/home\')">My boards</button> <button class="btn out sm" onclick="logout()">Log out</button>` : '';
}
async function logout() { await sb.auth.signOut(); me = profile = null; renderNav(); route(); }

/* ---------- AUTH ---------- */
const defaultMode = () => { try { return localStorage.getItem('returning') === '1' && !pending() ? 'login' : 'signup'; } catch(e) { return 'signup'; } };
function viewAuth(mode, open) {
  mode = mode || defaultMode();
  document.body.classList.add('landing');
  const invited = pending(), su = mode === 'signup';
  $app.innerHTML = `<div class="hero">
    <div class="hero-top"><div class="hero-logo">🏈 GRIDIRON SQUARES</div></div>
    <div class="hero-bot"><div class="cta">
      <div class="hero-h">${invited ? "You're invited.<br>Grab your squares." : 'Pick your squares.<br>Win the game.'}</div>
      <button class="btn blk go" id="open" style="background:#f9a825;color:#111;font-weight:600">${invited ? 'Join the board' : 'Log in / Join'}</button>
    </div></div>
    <div class="sheet ${open ? 'open' : ''}" id="sheet"><div class="authcard">
      <button class="xbtn" id="x" aria-label="Close">×</button>
      <div class="tabs" style="margin-right:28px"><button class="tab ${su ? 'on' : ''}" id="t-su">Join</button><button class="tab ${su ? '' : 'on'}" id="t-li">Log in</button></div>
      <div id="msg"></div>
      ${su ? '<input class="inp" id="nm" autocomplete="name" placeholder="Your name">' : ''}
      <input class="inp" id="em" type="email" autocomplete="email" placeholder="Email">
      <input class="inp" id="pw" type="password" autocomplete="${su ? 'new-password' : 'current-password'}" placeholder="Password (6+ characters)">
      <button class="btn blk go" id="go">${su ? 'Join the game' : 'Log in'}</button>
    </div></div></div>`;
  document.getElementById('open').onclick = () => document.getElementById('sheet').classList.add('open');
  document.getElementById('x').onclick = () => document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') e.target.classList.remove('open'); };
  document.getElementById('t-su').onclick = () => viewAuth('signup', true);
  document.getElementById('t-li').onclick = () => viewAuth('login', true);
  document.getElementById('go').onclick = async () => {
    const em = document.getElementById('em').value.trim(), pw = document.getElementById('pw').value;
    const nm = document.getElementById('nm')?.value.trim();
    const msg = document.getElementById('msg');
    if (!em || !pw || (su && !nm)) { msg.innerHTML = '<div class="err">Fill in every field.</div>'; return; }
    if (pw.length < 6) { msg.innerHTML = '<div class="err">Password must be at least 6 characters.</div>'; return; }
    document.getElementById('go').disabled = true;
    let r;
    if (su) r = await sb.auth.signUp({ email: em, password: pw, options: { data: { name: nm } } });
    else r = await sb.auth.signInWithPassword({ email: em, password: pw });
    if (r.error) { msg.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; document.getElementById('go').disabled = false; return; }
    if (!r.data.session) { msg.innerHTML = '<div class="info">Check your email to confirm your account, then log in.</div>'; document.getElementById('go').disabled = false; return; }

  const s = bsq(b), paid = s.filter(x => x.payment_status === 'paid'), pend = s.filter(x => x.payment_status === 'pending'), collected = sum(paid, x => x.amount_cents);

    const keep = SET; SET = { ...SET, ...s }; const ex = [5, 10, 25].map(p => { const f = feeFor(p * 100); return `$${p} squares → fee <b>${money(f)}</b>, winners share <b>${money(p * 100 * 100 - f)}</b>`; }).join('<br>'); SET = keep; $('fex').innerHTML = ex; };
  ['fm', 'ff', 'fp'].forEach(i => $(i).addEventListener('input', prev)); prev();
  $('sv').onclick = async () => { const s = read(); const { error } = await sb.from('platform_settings').update({ ...s, updated_at: new Date().toISOString() }).eq('id', 1); if (error) return flash(esc(error.message), 'err'); SET = { ...SET, ...s }; flash('Settings saved.'); };
}

/* Single board */
function adminGrid(b) {
  const at = {}; bsq(b).forEach(s => at[s.row + '-' + s.col] = s);
  const hn = b.home_numbers || [], an = b.away_numbers || [];
  let g = '<div class="grid"><div></div>' + [...Array(10).keys()].map(c => `<div class="hd">${b.numbers_drawn ? hn[c] : '?'}</div>`).join('');
  for (let r = 0; r < 10; r++) {
    g += `<div class="hd">${b.numbers_drawn ? an[r] : '?'}</div>`;
    for (let c = 0; c < 10; c++) { const s = at[r + '-' + c]; g += `<button class="cell ${s ? (s.payment_status === 'paid' ? 't-paid' : 't-pend') : ''}" onclick="adminTap(${r},${c})">${s ? esc(uname(s.player_id).slice(0, 4)) : ''}</button>`; }
  }
  return g + '</div>';
}
function adminTap(r, c) {
  const s = bsq(ADB).find(x => x.row === r && x.col === c);
  document.getElementById('ainsp').innerHTML = s ? `<div class="insp"><b>R${r + 1} · C${c + 1}</b> — ${esc(uname(s.player_id))} · <span class="badge ${s.payment_status === 'paid' ? 'grn' : 'org'}">${s.payment_status}</span> · ${METHODS[s.payment_method] || s.payment_method || ''}${ADB.numbers_drawn ? ` · ${ADB.home_numbers[c]}/${ADB.away_numbers[r]}` : ''}</div>` : `<div class="insp">R${r + 1} · C${c + 1} — open</div>`;
}
function periodPayouts(b, sqs, qi, hs, as_) {
  const r = b.rules || { periods: { q1: 25, q2: 25, q3: 25, q4: 25 }, main_pct: 100 };
  const pct = (r.periods || {})['q' + (qi + 1)] || 0;
  const paidSq = sqs.filter(s => s.payment_status === 'paid');
  const total = Math.floor(Math.max(0, sum(paidSq, s => s.amount_cents) - (b.platform_fee_cents || 0)) * pct / 100);
  const hd = hs % 10, ad = as_ % 10, col = b.home_numbers.indexOf(hd), row = b.away_numbers.indexOf(ad);
  const ex = [];
  if (r.reverse) ex.push({ role: 'Reverse', row: b.away_numbers.indexOf(hd), col: b.home_numbers.indexOf(ad) });
  if (r.cross) [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([x, y]) => ex.push({ role: 'Up/down/left/right', row: row + x, col: col + y }));
  if (r.corners) [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([x, y]) => ex.push({ role: 'Corner', row: row + x, col: col + y }));
  const n = ex.length, mp = n ? (r.main_pct || 50) : 100, mainAmt = Math.floor(total * mp / 100), each = n ? Math.floor((total - mainAmt) / n) : 0;
  const entries = [{ role: 'Winner', row, col, share: mainAmt }, ...ex.map(e => ({ ...e, share: each }))].map(e => {
    e.row = wrap10(e.row); e.col = wrap10(e.col); e.sq = paidSq.find(s => s.row === e.row && s.col === e.col) || null; return e; });
  const owned = entries.filter(e => e.sq), lost = sum(entries.filter(e => !e.sq), e => e.share), warnings = [];
  if (!owned.length) warnings.push('No one owns any winning square. Decide how to handle this period manually.');
  else {
    const bonus = Math.floor(lost / owned.length); owned.forEach(e => e.final = e.share + bonus); owned[0].final += total - sum(owned, e => e.final);
    if (lost) warnings.push(`${entries.length - owned.length} winning square(s) unsold/unpaid. Their ${money(lost)} was split evenly among the paid winners.`);
  }
  const by = new Map();
  owned.forEach(e => { const x = by.get(e.sq.player_id) || { pid: e.sq.player_id, amount: 0, labels: [] }; x.amount += e.final; x.labels.push(`${e.role} R${e.row + 1}C${e.col + 1}`); by.set(x.pid, x); });
  return { total, entries, pays: [...by.values()], warnings, hd, ad };
}
function calcAll(b) {
  const out = [];
  for (let i = 0; i < 4; i++) { const h = document.getElementById('hs' + i), a = document.getElementById('as' + i); if (!h || h.value === '' || a.value === '') continue;
    const hs = parseInt(h.value), as_ = parseInt(a.value); if (isNaN(hs) || isNaN(as_) || hs < 0 || as_ < 0) continue; out.push({ qi: i, hs, as: as_, out: periodPayouts(b, bsq(b), i, hs, as_) }); }
  return out;
}
function previewResults(boardId) {
  const b = AD.b.get(boardId), cs = calcAll(b), el = document.getElementById('res');
  if (!cs.length) { el.innerHTML = '<div class="sub" style="margin:0">Enter the scores above to see who wins.</div>'; return; }
  el.innerHTML = cs.map(c => `<div style="margin-bottom:12px"><b>${PERIODS[c.qi]}</b> · ${c.hs}–${c.as} · ends ${c.out.hd}/${c.out.ad} · pays ${money(c.out.total)}
    <table class="tb" style="margin-top:4px">${c.out.entries.map(e => `<tr><td>${e.role}</td><td>R${e.row + 1}C${e.col + 1}</td><td>${e.sq ? esc(uname(e.sq.player_id)) : '<span style="color:#b71c1c">unsold</span>'}</td><td style="text-align:right"><b>${e.sq ? money(e.final) : '—'}</b></td></tr>`).join('')}</table>
    ${c.out.warnings.map(w => `<div class="err" style="margin:4px 0 0">${esc(w)}</div>`).join('')}</div>`).join('') +
    `<button class="btn dark blk" onclick="saveResults('${boardId}')">Save results &amp; create payouts</button>`;
}
async function saveResults(boardId) {
  const b = AD.b.get(boardId), cs = calcAll(b);
  if (!cs.length) return flash('Enter at least one score.', 'err');
  for (const c of cs) if (AD.payouts.some(p => p.board_id === b.id && p.quarter === c.qi + 1 && p.kind === 'prize' && p.status === 'paid')) return flash(`${PERIODS[c.qi]} was already paid out, so it can't be recalculated.`, 'err');
  for (const c of cs) {
    let r = await sb.from('quarter_results').upsert({ board_id: b.id, quarter: c.qi + 1, home_score: c.hs, away_score: c.as, winning_square_id: c.out.entries[0].sq?.id || null }, { onConflict: 'board_id,quarter' });
    if (r.error) return flash(esc(r.error.message), 'err');
    r = await sb.from('payouts').delete().eq('board_id', b.id).eq('quarter', c.qi + 1).eq('kind', 'prize').eq('status', 'owed');
    if (r.error) return flash(esc(r.error.message), 'err');
    if (c.out.pays.length) { r = await sb.from('payouts').insert(c.out.pays.map(p => ({ board_id: b.id, quarter: c.qi + 1, player_id: p.pid, amount_cents: p.amount, status: 'owed', kind: 'prize', note: p.labels.join(', ') })));
      if (r.error) return flash(esc(r.error.message), 'err'); }
  }
  await route(); flash('Results saved and payouts created. Send the money from the Payouts tab.');
}
async function viewAdminBoard(id) {
  if (!await adminLoad()) return;
  const b = AD.b.get(id);
  if (!b) return adminShell('/admin/boards', '<div class="err">Board not found.</div>');
  ADB = b;
  const st = bstats(b), tr = troubles(b), own = AD.u.get(b.admin_id), pend = st.s.filter(s => s.payment_status === 'pending'), pids = pend.map(s => s.id).join(',');
  const pm = new Map(); st.s.forEach(s => { const x = pm.get(s.player_id) || { pid: s.player_id, n: 0, paid: 0, ids: [], m: s.payment_method }; x.n++; if (s.payment_status === 'paid') x.paid++; else x.ids.push(s.id); pm.set(s.player_id, x); });
  const myPay = AD.payouts.filter(p => p.board_id === b.id), res = AD.results.filter(r => r.board_id === b.id);
  const per = b.rules?.periods || { q1: 25, q2: 25, q3: 25, q4: 25 };
  const acts = [];
  if (b.status === 'open') { if (pend.length) acts.push(`<button class="btn dark" onclick="adminConfirm('${pids}','${b.id}')">Confirm all ${pend.length} pending</button><button class="btn out" onclick="adminRelease('${pids}')">Release all pending</button>`);
    acts.push(`<button class="btn out" onclick="adminForceStart('${b.id}')">Force start (draw numbers)</button>`); }
  if (b.status === 'live') acts.push(`<button class="btn out" onclick="adminSetStatus('${b.id}','complete')">Mark complete</button>`);
  if (b.status === 'open' || b.status === 'live') acts.push(`<button class="btn out" style="color:#b71c1c" onclick="adminSetStatus('${b.id}','cancelled')">Cancel board</button>`);
  if (b.status === 'cancelled' && st.paid && !myPay.some(p => p.kind === 'refund')) acts.push(`<button class="btn dark" onclick="createRefunds('${b.id}')">Create refunds (${money(st.collected)})</button>`);
  adminShell('/admin/boards', `<a href="#/admin/boards" style="font-size:12px">← All boards</a>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:6px"><div><div class="h1">${bname(b)}</div><div class="sub">${b.code} · ${esc(own?.name || '')} ${own?.email ? '(' + esc(own.email) + ')' : ''}</div></div>${stBadge2(b.status)}</div>
    ${tr.length ? `<div class="err">${tr.map(esc).join('<br>')}</div>` : ''}
    <div class="two"><div>
      <div class="card gridwrap" style="padding:10px"><div id="ainsp"></div>${adminGrid(b)}<div class="muted" style="text-align:center;margin-top:6px">Tap a square for details</div></div>
      <div class="card" style="padding:0;overflow-x:auto"><div class="sec" style="padding:12px 12px 0">Players</div><table class="tb"><tr><th>Player</th><th>Squares</th><th>Status</th><th></th></tr>
        ${[...pm.values()].map(x => `<tr><td><b>${esc(uname(x.pid))}</b><br><span class="muted">${esc(AD.u.get(x.pid)?.email || '')}</span></td><td>${x.n}</td><td>${x.paid === x.n ? '<span class="badge grn">paid</span>' : `<span class="badge org">${x.n - x.paid} pending</span><br><span class="muted">${METHODS[x.m] || x.m || ''}</span>`}</td>
          <td style="white-space:nowrap">${x.ids.length ? `<button class="btn dark sm" onclick="adminConfirm('${x.ids.join(',')}','${b.id}')">Confirm</button> <button class="btn out sm" onclick="adminRelease('${x.ids.join(',')}')">Release</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No squares yet.</td></tr>'}</table></div>
    </div><div>
      <div class="card"><div class="sec">Money</div>
        <div class="kv"><span>Price per square</span><b>${money(b.price_cents)}</b></div>
        <div class="kv"><span>Paid squares</span><b>${st.paid}/100 · ${money(st.collected)}</b></div>
        <div class="kv"><span>${esc(feeLabel())}</span><b>${money(b.platform_fee_cents || 0)}</b></div>
        <div class="kv"><span>Prize pool (collected − fee)</span><b>${money(st.pool)}</b></div>
        <div class="kv"><span>Rules</span><b style="font-size:12px;font-weight:500">${esc(rulesText(b.rules))}</b></div>
        <div class="kv"><span>Game time</span><b>${b.game_time ? new Date(b.game_time).toLocaleString() : 'Not set'}</b></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:flex-end"><div style="flex:1"><label class="lbl">Override board fee ($)</label><input class="inp" id="fee" type="number" inputmode="decimal" value="${(b.platform_fee_cents || 0) / 100}" style="margin:0"></div><button class="btn out" onclick="setFee('${b.id}')">Save fee</button></div></div>
      ${acts.length ? `<div class="card"><div class="sec">Help this board</div><div style="display:flex;flex-wrap:wrap;gap:8px">${acts.join('')}</div></div>` : ''}
      <div class="card"><div class="sec">Results &amp; payouts</div>
        ${!b.numbers_drawn ? '<div class="sub" style="margin:0">Numbers aren\'t drawn yet. Results can be entered once the game starts.</div>' : `
        <div class="sub">Enter the score at the end of each period. Winners are worked out from the board's rules.</div>
        ${['q1', 'q2', 'q3', 'q4'].map((k, i) => { if (!per[k]) return ''; const r = res.find(x => x.quarter === i + 1);
          return `<div class="row" style="align-items:flex-end;margin-bottom:6px"><div style="flex:1.2;font-size:13px"><b>${PERIODS[i]}</b><br><span class="muted">${per[k]}%</span></div>
            <div><label class="lbl">${esc(b.home_team)}</label><input class="inp" id="hs${i}" type="number" inputmode="numeric" value="${r?.home_score ?? ''}" style="margin:0" oninput="previewResults('${b.id}')"></div>
            <div><label class="lbl">${esc(b.away_team)}</label><input class="inp" id="as${i}" type="number" inputmode="numeric" value="${r?.away_score ?? ''}" style="margin:0" oninput="previewResults('${b.id}')"></div></div>`; }).join('')}
        <div id="res" style="margin-top:10px"></div>`}
        ${myPay.length ? `<div class="sec" style="margin-top:12px">Payouts on this board</div>${myPay.map(p => `<div class="kv"><span>${esc(uname(p.player_id))} · ${p.kind === 'refund' ? 'Refund' : PERIODS[(p.quarter || 1) - 1]}</span><span><b>${money(p.amount_cents)}</b> ${p.status === 'paid' ? '<span class="badge grn">paid</span>' : '<span class="badge org">owed</span>'}</span></div>`).join('')}` : ''}</div>
    </div></div>`);
  if (b.numbers_drawn) previewResults(b.id);
}
function setFee(id) { const v = parseFloat(document.getElementById('fee').value); if (isNaN(v) || v < 0) return flash('Enter a valid fee.', 'err'); adminDo(() => sb.from('boards').update({ platform_fee_cents: Math.round(v * 100) }).eq('id', id), 'Board fee updated.'); }
function adminForceStart(id) { if (!confirm('Draw the numbers now? No more squares can be sold after this, and unpaid reserved squares are released.')) return; adminDo(() => sb.rpc('reveal_numbers', { p_board: id, p_force: true }), 'Numbers drawn. The game is live.'); }
function adminSetStatus(id, s) { if (!confirm(s === 'cancelled' ? 'Cancel this board? Players will need refunds.' : 'Mark this board complete?')) return; adminDo(() => sb.from('boards').update({ status: s }).eq('id', id), s === 'cancelled' ? 'Board cancelled. Create refunds when ready.' : 'Board marked complete.'); }
function createRefunds(id) {
  const b = AD.b.get(id), by = new Map(); bsq(b).filter(s => s.payment_status === 'paid').forEach(s => by.set(s.player_id, (by.get(s.player_id) || 0) + s.amount_cents));
  adminDo(() => sb.from('payouts').insert([...by].map(([pid, amt]) => ({ board_id: id, player_id: pid, amount_cents: amt, status: 'owed', kind: 'refund', note: 'Board cancelled' }))), 'Refunds added to the Payouts tab.');
}

/* Player payout info (shown on the player home screen) */
function payoutCardHtml() {
  return `<div class="card" style="margin-top:12px"><div class="sec">Payout info</div><div class="sub" style="margin-bottom:8px">Where should we send your winnings? Venmo @name, Zelle email/phone, or Cash App $name.</div>
    <input class="inp" id="ph" value="${esc(profile?.pay_handle || '')}" placeholder="e.g. Venmo @yourname"><button class="btn out blk" id="phs">Save</button><div id="phm"></div></div>`;
}
function bindPayoutCard() {
  const b = document.getElementById('phs'); if (!b) return;
  b.onclick = async () => { const v = document.getElementById('ph').value.trim(); const { error } = await sb.from('users').update({ pay_handle: v || null }).eq('id', me.id);
    document.getElementById('phm').innerHTML = error ? `<div class="err" style="margin-top:8px">${esc(error.message)}</div>` : '<div class="info" style="margin-top:8px">Saved.</div>'; if (!error) profile.pay_handle = v; };
}

/* ---------- ROUTER ---------- */
async function route() {
  document.body.classList.remove('landing', 'admin');
  if (!me) return viewAuth();
  if (!setLoaded) await loadSettings();
  const p = location.hash.slice(1) || '/';
  if (p === '/') return (profile?.is_owner && !pending()) ? viewAdminHome() : viewHome();
  if (p === '/home') return viewHome();
  if (p === '/new') return viewNew();
  if (p === '/join') return viewJoin();
  if (p === '/admin') return viewAdminHome();
  if (p === '/admin/boards') return viewAdminBoards();
  if (p === '/admin/payments') return viewAdminPayments();
  if (p === '/admin/payouts') return viewAdminPayouts();
  if (p === '/admin/settings') return viewAdminSettings();
  if (p.startsWith('/admin/b/')) return viewAdminBoard(p.slice(9));
  if (p.startsWith('/b/')) return viewBoard(p.slice(3));
  viewHome();
}
window.addEventListener('hashchange', route);
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { me = data.session.user; profile = await ensureProfile(me); }
  renderNav(); route();
})();
</script>
